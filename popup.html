<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    h3 {
      margin: 0 0 15px 0;
      color: #333;
      font-size: 16px;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }
    .toggle-label {
      font-size: 14px;
      color: #333;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .stats {
      padding: 10px;
      background: #e3f2fd;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #1976d2;
      text-align: center;
    }
    .stats strong {
      font-size: 20px;
      display: block;
      margin-bottom: 3px;
    }
    .info {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }
    .status {
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.info {
      background: #e3f2fd;
      color: #1976d2;
    }
  </style>
</head>
<body>
  <h3>🎮 PSDeals - Приховати куплені</h3>
  
  <div class="toggle-container">
    <span class="toggle-label">Приховувати куплені ігри</span>
    <label class="switch">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div id="statsContainer" style="display: none;">
    <div class="stats">
      <strong id="statsCount">0</strong>
      <span>куплених ігор приховано</span>
    </div>
  </div>

  <div id="statusMessage"></div>
  
  <div class="info">
    ℹ️ Розширення автоматично приховує ігри з іконкою "Куплено" на всіх сторінках PSDeals.
  </div>

  <script src="popup.js"></script>
</body>
</html>
